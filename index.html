<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0084FF">
    <meta name="description" content="A simple Hello World progressive web app.">
    <title>Hello World PWA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="./manifest.json">
</head>

<body>
    <div class="wrap">

        <header class="app-head no-print">
            <h1 id="brand"></h1>
            <p id="brandCity"></p>
        </header>

        <div class="bar no-print">
            <button class="btn" id="btnSelect" type="button">Select</button>
            <span class="hint" id="hint"></span>
        </div>

        <div class="tbl-card no-print">
            <table id="grid"></table>
        </div>

        <section class="invoice-wrap" id="invoiceSection" hidden>
            <div class="invoice">
                <div class="inv-head">
                    <div>
                        <div class="inv-company" id="invCompany"></div>
                        <div class="inv-city" id="invCity"></div>
                    </div>
                    <div class="inv-side">
                        <div class="inv-title">INVOICE</div>
                        <div class="inv-date" id="invDate"></div>
                    </div>
                </div>
                <div class="inv-body">
                    <table class="inv-table">
                        <thead>
                            <tr>
                                <th class="l">#</th>
                                <th class="l">Item (size)</th>
                                <th>Rate</th>
                                <th>Qty</th>
                                <th>Amount</th>
                                <th class="no-print"></th>
                            </tr>
                        </thead>
                        <tbody id="lines"></tbody>
                    </table>
                    <div class="inv-total">
                        <div class="tq">Total quantity: <b id="totQty"></b></div>
                        <div class="grand"><span>Total</span><b id="grand"></b></div>
                    </div>
                    <div class="inv-foot">Thank you for your purchase. Please visit again.</div>
                </div>
            </div>
            <div class="actions no-print">
                <button class="btn" id="btnPdf" type="button">Save PDF</button>
                <button class="btn" id="btnShare" type="button" hidden>Share PDF</button>
                <button class="btn outline" id="btnPrint" type="button">Print</button>
                <button class="btn outline" id="btnNew" type="button">Clear & Make a New invoice</button>
            </div>
        </section>
    </div>

    <div class="modal-backdrop no-print" id="dupBackdrop" hidden>
        <div class="modal-box">
            <p>This item is already selected.</p>
            <button class="btn dupbtn" id="dupOk" type="button">OK</button>
        </div>
    </div>

    <div class="dock no-print" id="dock" hidden>
        <div class="pick" id="pick" hidden>
            <div class="chip"><b id="pickName"></b><span id="pickPrice"></span></div>
            <div class="qty">
                <button class="step" type="button" data-d="-1" aria-label="Decrease quantity">&minus;</button>
                <input id="qty" type="number" inputmode="numeric" min="1" step="1" value="1" aria-label="Quantity">
                <button class="step" type="button" data-d="1" aria-label="Increase quantity">+</button>
            </div>
            <button class="btn done" id="btnDone" type="button">Done</button>
        </div>
        <div class="added" id="added" hidden>
            <b class="cnt" id="cnt"></b>
            <div class="chips" id="chips"></div>
            <button class="btn sm" id="btnView" type="button">View invoice</button>
        </div>
    </div>

    <script src="./app.js"></script>
</body>

</html>
