<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#183b32">
  <meta name="description" content="A small, offline-ready Hello World progressive web app starter.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Hello World PWA</title>
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="welcome" aria-labelledby="welcome-title">
    <p class="eyebrow">A PROGRESSIVE WEB APP</p>
    <h1 id="welcome-title">Hello,<br><span>world.</span></h1>
    <p class="intro">Your next idea starts here.</p>
    <button class="install-button" id="install-button" type="button">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
        <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 16v4h14v-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span>Install app</span>
    </button>
    <p class="install-status" id="install-status" role="status" aria-live="polite"></p>
  </main>
  <noscript>This app needs JavaScript enabled to install and work offline.</noscript>
</body>
</html>
